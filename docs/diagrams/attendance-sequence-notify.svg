<rect x="30" y="2039" width="2500" height="76" rx="3" fill="#FFF8DF" stroke="#C6AD62"/>
<text font-family="Arial,sans-serif" font-size="18" fill="#172A3A" text-anchor="start"><tspan x="44" y="2066">Offline parent: the durable notification remains readable through /Notifications or /Notifications/Feed after authenticated login and current-scope checks. Send failure does not roll back attendance. Retry can repeat delivery; the client deduplicates by Notification.Id. Only attendance alert</tspan><tspan x="44" y="2089.4">status changes queue notifications; comment-only updates do not.</tspan></text>
<text font-family="Arial,sans-serif" font-size="17" fill="#172A3A" text-anchor="start"><tspan x="35" y="2250">LEGEND: solid filled arrow = call; dashed open arrow = return; solid open arrow = asynchronous event. Vertical dashed lines are lifelines. alt / opt / loop frames are conditional / optional / repeated behavior.</tspan></text></svg>
