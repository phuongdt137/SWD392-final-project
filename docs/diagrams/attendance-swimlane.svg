<text font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#16324F" text-anchor="start"><tspan x="20" y="41.5">ATTENDANCE — RECORD AND UPDATE</tspan></text>
<text font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="20" y="73.3">Precondition: authenticated active user. Login and student/parent history are separate flows.</tspan></text>
<ellipse cx="167" cy="207" rx="27" ry="27" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="167" y="212.25">Start</tspan></text>
<rect x="225" y="172" width="180" height="70" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2" />
<text font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="315" y="201.7">Open</tspan><tspan x="315" y="226.29999999999998">Attendance</tspan></text>
<rect x="690" y="172" width="240" height="80" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2" />
<text font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="810" y="219">Choose date and lesson</tspan></text>
<rect x="1315" y="150" width="235" height="110" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2" />
<text font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="1432.5" y="187.4">Mark every student;</tspan><tspan x="1432.5" y="212">add notes / correction</tspan><tspan x="1432.5" y="236.60000000000002">reason</tspan></text>
<rect x="1580" y="172" width="210" height="80" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2" />
<text font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="1685" y="206.7">Save attendance /</tspan><tspan x="1685" y="231.29999999999998">changes</tspan></text>
<rect x="2175" y="150" width="235" height="95" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2" />
<text font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="2292.5" y="192.2">View results and</tspan><tspan x="2292.5" y="216.79999999999998">messages</tspan></text>
<polygon points="2535,155 2590,202.5 2535,250 2480,202.5" fill="#EFF6FF" stroke="#475569" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="2535" y="197.73000000000002">Another</tspan><tspan x="2535" y="219.87">lesson?</tspan></text>
<ellipse cx="2667" cy="205" rx="27" ry="27" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="2667" y="210.25">End</tspan></text>
<rect x="425" y="455" width="225" height="85" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2" />
<text font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="537.5" y="492.2">Load permitted</tspan><tspan x="537.5" y="516.8">lessons</tspan></text>
<rect x="690" y="455" width="240" height="110" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2" />
<text font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="810" y="492.4">Load roster, saved</tspan><tspan x="810" y="517">results and approved</tspan><tspan x="810" y="541.6">leave</tspan></text>
<polygon points="1080,465 1145,522.5 1080,580 1015,522.5" fill="#EFF6FF" stroke="#475569" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="1080" y="517.73">Editing</tspan><tspan x="1080" y="539.87">allowed?</tspan></text>
<rect x="1015" y="650" width="245" height="90" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2" />
<text font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="1137.5" y="689.7">Show read-only sheet</tspan><tspan x="1137.5" y="714.3000000000001">and reason</tspan></text>
<rect x="1560" y="455" width="230" height="110" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2" />
<text font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="1675" y="492.4">Recheck access, time,</tspan><tspan x="1675" y="517">roster, results and</tspan><tspan x="1675" y="541.6">versions</tspan></text>
<polygon points="1897.5,465 1955,512.5 1897.5,560 1840,512.5" fill="#EFF6FF" stroke="#475569" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="1897.5" y="518.8">Valid?</tspan></text>
<rect x="1500" y="900" width="310" height="85" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2" />
<text font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="1655" y="937.2">Reject request; explain error.</tspan><tspan x="1655" y="961.8000000000001">Require reload on conflict.</tspan></text>
<rect x="2020" y="455" width="300" height="155" rx="10" fill="#F0FDF4" stroke="#475569" stroke-width="2" />
<text font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="2170" y="502.6">Save changed results + audit</tspan><tspan x="2170" y="527.2">+ applicable notifications</tspan><tspan x="2170" y="551.8000000000001">atomically. Recheck deadline</tspan><tspan x="2170" y="576.4000000000001">before commit.</tspan></text>
<rect x="2010" y="900" width="250" height="85" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2" />
<text font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="2135" y="949.5">Roll back; show error</tspan></text>
<rect x="2350" y="795" width="285" height="120" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2" stroke-dasharray="8 5"/>
<text font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="2492.5" y="837.4">Background dispatcher:</tspan><tspan x="2492.5" y="862">send to linked parent; retry</tspan><tspan x="2492.5" y="886.6">send failures</tspan></text>
<rect x="2350" y="1175" width="285" height="95" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2" />
<text font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="2492.5" y="1217.2">Receive in-app alert or read</tspan><tspan x="2492.5" y="1241.8">stored notification later</tspan></text>
<ellipse cx="2687" cy="1221" rx="27" ry="27" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="2687" y="1226.25">End</tspan></text>
<rect x="20" y="1370" width="2740" height="260" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
<text font-family="Arial, sans-serif" font-size="20" fill="#0F172A" text-anchor="start"><tspan x="40" y="1410" font-weight="bold">BUSINESS RULES</tspan><tspan x="40" y="1441">Access: teacher edits assigned lessons; homeroom access alone is read-only. STAFF edits school-wide. ADMIN requires an Employee profile.</tspan><tspan x="40" y="1472">Time: no marking before lesson start. Teacher locks at 00:00 next day (Vietnam time). STAFF / ADMIN are exempt from that deadline.</tspan><tspan x="40" y="1503">Results: PRESENT / ABSENT / LATE / EXCUSED. EXCUSED requires approved leave for the same student and date.</tspan><tspan x="40" y="1534">Corrections require a reason. Stale roster / versions require reload. Unchanged saves create no new audit or notification.</tspan><tspan x="40" y="1565">Notifications: absence / lateness alerts and their corrections; comments alone do not create another alert. Missing active parent: save succeeds with a warning.</tspan><tspan x="40" y="1596">Success response does not wait for notification delivery. Completed attendance is derived; there is no stored Submitted session status.</tspan></text>
<rect x="510.25" y="314.5" width="149.5" height="31" rx="3" fill="#FFFFFF"/><text font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#16324F" text-anchor="middle"><tspan x="585" y="335.95">Display lessons</tspan></text>
<rect x="789.5" y="343.5" width="105" height="31" rx="3" fill="#FFFFFF"/><text font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#16324F" text-anchor="middle"><tspan x="842" y="364.95">Open sheet</tspan></text>
<rect x="1091.1" y="604.5" width="33.8" height="31" rx="3" fill="#FFFFFF"/><text font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#16324F" text-anchor="middle"><tspan x="1108" y="625.95">No</tspan></text>
<rect x="1193.65" y="379.5" width="42.7" height="31" rx="3" fill="#FFFFFF"/><text font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#16324F" text-anchor="middle"><tspan x="1215" y="400.95">Yes</tspan></text>
<rect x="1796.95" y="314.5" width="96.10000000000001" height="31" rx="3" fill="#FFFFFF"/><text font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#16324F" text-anchor="middle"><tspan x="1845" y="335.95">Read-only</tspan></text>
<rect x="1700.3" y="349.5" width="69.4" height="31" rx="3" fill="#FFFFFF"/><text font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#16324F" text-anchor="middle"><tspan x="1735" y="370.95">Submit</tspan></text>
<rect x="1918.1" y="709.5" width="33.8" height="31" rx="3" fill="#FFFFFF"/><text font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#16324F" text-anchor="middle"><tspan x="1935" y="730.95">No</tspan></text>
<rect x="745.8" y="844.5" width="158.4" height="31" rx="3" fill="#FFFFFF"/><text font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#16324F" text-anchor="middle"><tspan x="825" y="865.95">Correct / reload</tspan></text>
<rect x="1960.65" y="484.5" width="42.7" height="31" rx="3" fill="#FFFFFF"/><text font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#16324F" text-anchor="middle"><tspan x="1982" y="505.95">Yes</tspan></text>
<rect x="2210.85" y="719.5" width="78.30000000000001" height="31" rx="3" fill="#FFFFFF"/><text font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#16324F" text-anchor="middle"><tspan x="2250" y="740.95">Failure</tspan></text>
<rect x="2170.85" y="299.5" width="78.30000000000001" height="31" rx="3" fill="#FFFFFF"/><text font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#16324F" text-anchor="middle"><tspan x="2210" y="320.95">Success</tspan></text>
<rect x="1618.65" y="124.5" width="42.7" height="31" rx="3" fill="#FFFFFF"/><text font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#16324F" text-anchor="middle"><tspan x="1640" y="145.95">Yes</tspan></text>
<rect x="2598.1" y="167.5" width="33.8" height="31" rx="3" fill="#FFFFFF"/><text font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#16324F" text-anchor="middle"><tspan x="2615" y="188.95">No</tspan></text>
<rect x="2341.8" y="641.5" width="336.40000000000003" height="31" rx="3" fill="#FFFFFF"/><text font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#16324F" text-anchor="middle"><tspan x="2510" y="662.95">After commit, if notification queued</tspan></text>
<rect x="2495.6" y="1019.5" width="122.80000000000001" height="31" rx="3" fill="#FFFFFF"/><text font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#16324F" text-anchor="middle"><tspan x="2557" y="1040.95">Asynchronous</tspan></text>
</svg>
